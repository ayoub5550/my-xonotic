plugins { id 'com.android.application' }

def versionFile = rootProject.file('../VERSION')
def appVersion = versionFile.exists() ? versionFile.text.trim() : '0.1.0'

android {
    namespace 'com.ayoub.xonotic'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.ayoub.xonotic'
        minSdk 26
        targetSdk 34
        versionCode (project.hasProperty('versionCode') ? project.versionCode.toInteger() : 4)
        versionName appVersion
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug { }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
    // PK3s already contain compressed data. Avoid recompression and giant inflation buffers.
    aaptOptions { noCompress 'pk3' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
